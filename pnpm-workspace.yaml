# Three days of quarantine before any newly published version is installable
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0

# Keep the virtual store inside node_modules: Vite's dev server and the consumer container read it from there
enableGlobalVirtualStore: false
shellEmulator: true

packages:
  - 'packages/*'
  - app

overrides:
  # Patched brace-expansion (GHSA-q2hr-2g5m-vwhr and related DoS); drop once minimatch resolves it
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  # Patched tinypool (GHSA-85c8-ppgw-ccpr, GHSA-5gmw-xhrv-c9v3); drop once eslint-plugin-format moves past oxfmt 0.35
  tinypool@<2.1.2: ^2.1.2

allowBuilds:
  esbuild: true
  vue-demi: true

# Single source of truth for dependency versions; manifests reference `catalog:`
catalog:
  '@antfu/eslint-config': ^9.3.0
  '@changesets/cli': 3.0.3
  '@fontsource-variable/geist-mono': ^5.3.0
  '@fontsource-variable/instrument-sans': ^5.3.0
  '@iconify-json/ph': ^1.2.2
  '@types/node': ^22.20.1
  '@unocss/eslint-plugin': ^66.8.1
  '@unocss/preset-icons': ^66.8.1
  '@unocss/preset-uno': ^66.8.1
  '@unocss/reset': ^66.8.1
  '@unocss/vite': ^66.8.1
  '@vitejs/plugin-vue': ^5.2.1
  '@vue/test-utils': ^2.5.1
  '@vueuse/core': ^12.8.2
  eslint: ^10.9.1
  eslint-plugin-format: ^2.0.1
  eslint-plugin-no-unsanitized: ^4.1.5
  eslint-plugin-security: ^4.2.0
  happy-dom: ^21.0.0
  microlighter: ^2.1.0
  pinia: ^3.0.1
  reka-ui: ^2.10.3
  rolldown: ^1.2.6
  typescript: ^5.9.3
  unocss: ^66.8.1
  vite: ^6.2.0
  vitest: ^4.1.11
  vue: ^3.5.13
  vue-router: ^4.6.4
  vue-tsc: ^2.2.8
