allowBuilds:
  esbuild: true
  lefthook: true
  vue-demi: true

# Three days of quarantine before any newly published version is installable
minimumReleaseAge: 4320

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0

packages:
  - 'packages/*'
  - app
# Patched brace-expansion (GHSA-q2hr-2g5m-vwhr and related DoS); drop once minimatch resolves it
overrides:
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
