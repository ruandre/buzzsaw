name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queued runs collapse to the latest, but a deploy already running finishes rather than being cut off mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: $/.github/workflows/ci.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
