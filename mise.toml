# Single source of truth for toolchain, environment and tasks.
# Machine-specific overrides go in mise.local.toml (gitignored).
min_version = "2026.9.17"

# Tools that ship an agent skill (aube, hk) link it into .agents/skills for the version installed here.
[settings]
skills.dir = ".agents/skills"
skills.auto_sync = true
skills.prune = true

[tools]
node = "26.12.0"
aube = "2.8.1"
hk = "2.8.0"
pkl = "0.32.1"
pinact = "5.0.0"

[env]
_.path = [ "{{config_root}}/node_modules/.bin" ]

# Hooks resolve tools through mise, so they use the versions pinned above
HK_MISE = "1"

# Tasks are the project's command interface: `mise tasks` lists them, `mise run <task> --help` explains one.

# --- Develop ---

[tasks.setup]
description = "First-time setup: toolchain, dependencies, git hooks"
run = [
  "mise install",
  "aube install",
  "hk install --mise"
]

[tasks.dev]
description = "Start the app dev server"
run = "aube -F @rjvr/buzzsaw-app run dev"

[tasks.build]
description = "Build every library and the app, in dependency order"
run = "aube -r run build"

[tasks.preview]
description = "Build, then serve the app with the real security headers"
depends = [ "build" ]
run = "aube -F @rjvr/buzzsaw-app run preview"

[tasks.clean]
description = "Remove build artifacts and caches"
run = "rm -rf app/dist packages/*/dist node_modules/.vite"

# --- Verify ---

[tasks.lint]
description = "Run every linter and formatter check"
run = "hk check --all"

[tasks.fix]
description = "Auto-fix lint and formatting issues"
run = "hk fix --all"

[tasks.typecheck]
description = "Type-check every workspace package, plus root configs and scripts"
run = [
  "aube -r run typecheck",
  "aube exec tsc -p tsconfig.tooling.json"
]

[tasks.test]
description = "Run the tests, optionally filtered (`mise run test wav`)"
run = "aube exec vitest run"

[tasks."test:watch"]
description = "Run the tests in watch mode"
run = "aube exec vitest watch"

[tasks."actions:check"]
description = "Verify every GitHub Actions pin names its real version and meets the minimum age (GitHub API; set GITHUB_TOKEN)"
run = "pinact run --check --verify-comment --verify-min-age"

[tasks."actions:update"]
description = "Pin GitHub Actions to their newest release older than the minimum age, then verify the comments"
run = "pinact run --update --verify-comment"

[tasks."changeset:check"]
description = "Fail when a library changed since a base (default origin/main) and the branch adds no changeset"
usage = 'arg "[base]" help="Branch or commit to compare against" default="origin/main"'
# `changeset status` alone passes as long as any changeset exists, so the branch's own diff must add one
run = """
#!/usr/bin/env bash
set -euo pipefail
if git diff --quiet "$usage_base" -- packages; then
  echo "no library changes since $usage_base"
  exit 0
fi
added=$(git diff --name-only --diff-filter=A "$usage_base" -- '.changeset/*.md' ':!.changeset/README.md')
if [[ -z "$added" ]]; then
  echo "libraries changed since $usage_base but this branch adds no changeset; run: mise run changeset" >&2
  exit 1
fi
echo "changesets added: $added"
aube exec changeset status --since="$usage_base"
"""

[tasks.check]
description = "Quality gate before a commit: lint, typecheck, test"
depends = [
  "lint",
  "typecheck",
  "test"
]

[tasks.audit]
description = "Fail on a high or critical advisory against the installed dependencies (npm registry)"
run = "aube audit --audit-level high"

[tasks.ci]
description = "Everything CI runs: check, audit, build, consumer verification"
depends = [
  "check",
  "audit",
  "build",
  "verify-consumer"
]

[tasks.outdated]
description = "Report available updates for tools and npm packages (changes nothing)"
run = [
  "mise outdated --bump --local",
  # Exit status 1 only means updates exist
  "aube outdated --recursive || [ $? -eq 1 ]"
]

[tasks."deps:update"]
description = "Re-resolve every npm dependency to the newest version its range allows, then reinstall"
# A clean resolve instead of `aube update`: that command rewrites the workspace link entries
# (link:../packages/core) with the importer directory prepended, which breaks the links
run = [
  "rm -rf node_modules app/node_modules packages/*/node_modules aube-lock.yaml",
  "aube install"
]

[tasks.verify-consumer]
description = "Pack both libraries and typecheck + run them as a Node ESM consumer, in a throwaway container"
run = "docker compose -f test/consumer/compose.yaml run --rm verify"

# --- Release ---

[tasks.changeset]
description = "Describe a library change and the version bump it deserves (interactive)"
raw = true
run = "aube exec changeset"

[tasks."changeset:status"]
description = "Show which libraries have pending changesets on this branch"
run = "aube exec changeset status --since=origin/main"

[tasks.version]
description = "Apply every pending changeset: bump manifests, rewrite CHANGELOGs"
run = [
  "aube exec changeset version",
  "aube install --lockfile-only"
]

[tasks.pack]
description = "Build and pack both libraries in a throwaway container, printing what the tarballs contain"
run = """
docker compose -f test/consumer/compose.yaml run --rm verify sh -c \
  'sh /repo/scripts/container/pack-libs.sh && tar -tzf /work/tarballs/core.tgz && tar -tzf /work/tarballs/wav.tgz'
"""

[tasks.pre-commit]
run = "hk run pre-commit"
